spring.application.name=spring-boot-sample
server.servlet.context-path=/autoloan

applicant.min.age=18

# Loan Application validation
loan.error.101=Applicant cannot be null.
loan.error.102=Vehicle cannot be null.
loan.error.103=Down payment must be greater than or equal to 0.
loan.error.104=Term must be at least 12 months.
loan.error.105=Term cannot exceed 60 months.

# Applicant validation
loan.error.201=First name is required.
loan.error.202=Last name is required.
loan.error.203=SSN is required.
loan.error.204=Phone number is required.
loan.error.205=Date of birth is required.
loan.error.206=Address is required.
loan.error.207=At least one income entry is required.
loan.error.208=At least one expense entry is required.

# Address validation
loan.error.301=Street number is required.
loan.error.302=Street name is required.
loan.error.303=City is required.
loan.error.304=State is required.
loan.error.305=Zip code is required.

# Vehicle validation
loan.error.401=Vehicle make is required.
loan.error.402=Vehicle model is required.
loan.error.403=Vehicle year must be 2000 or later.

# Income validation
loan.error.501=Income type is required.
loan.error.502=Monthly income amount must be greater than or equal to 0.

# Expense validation
loan.error.601=Expense type is required.
loan.error.602=Monthly expense amount must be greater than or equal to 0.
